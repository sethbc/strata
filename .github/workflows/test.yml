name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its superseded run. Runs on main are
# never canceled: each gets a group of its own (in a shared group a pending
# run would still be replaced by the next one, even without cancel-in-progress)
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    name: lua
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # norns runs Lua 5.3 (matron links lua53); LuaJIT catches 5.1-isms
      - name: Install Lua 5.3 and LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 luajit

      - name: Behavior tests (Lua 5.3)
        run: lua5.3 test/run.lua

      - name: Behavior tests (LuaJIT)
        run: luajit test/run.lua

      - name: Lua / engine command sync check
        run: lua5.3 test/sync_check.lua

  engine:
    name: engine
    runs-on: ubuntu-24.04
    env:
      # the norns commit the engine is compiled against (sc/core classes)
      NORNS_REF: 227aa044
      NORNS_DIR: ${{ github.workspace }}/norns
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
      # SuperCollider is pinned to Ubuntu 24.04's package (upstream 3.13.0).
      # norns ships SuperCollider 3.13.0 (SUPERCOLLIDER_VERSION in norns'
      # Dockerfile; the norns repo records no other version), so this is the
      # same upstream release; only Ubuntu's packaging differs. Bump both
      # packages together, and re-check against norns' Dockerfile. To find a
      # version string, run `apt-cache madison supercollider-language` on the
      # runner image (ubuntu-24.04): it lists every version apt can install.
      # supercollider-common is not named below, but it is pinned all the
      # same: supercollider-language depends on exactly its own version of
      # it (see `apt-cache show supercollider-language`).
      SC_APT_VERSION: 1:3.13.0+repack-1ubuntu3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out norns
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/monome/norns.git "$NORNS_DIR"
          git -C "$NORNS_DIR" checkout "$NORNS_REF"

      - name: Install SuperCollider and JACK
        run: |
          echo "jackd2 jackd/tweak_rt_limits boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y jackd2 \
            "supercollider-language=$SC_APT_VERSION" "supercollider-server=$SC_APT_VERSION"

      # scsynth talks to JACK; a dummy driver needs no sound card
      - name: Start JACK (dummy driver)
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 1024 > "$RUNNER_TEMP/jackd.log" 2>&1 &
          for i in $(seq 1 20); do jack_lsp > /dev/null 2>&1 && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/jackd.log"; exit 1

      - name: Engine check
        run: SCLANG="$(command -v sclang)" timeout 600 test/run_engine_check.sh "$NORNS_DIR"
