name: tests

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository (a pull request runs its own test code
# here), so the token gets no more than that (#490)
permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Runs on main are
# never canceled: each gets a group of its own (in a shared group a pending
# run would still be replaced by the next one, even without cancel-in-progress)
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every apt-get below takes these (#785): apt tries a failed file once more
  # (Acquire::Retries, apt.conf(5)) and drops a connection that sends nothing
  # for 15 s (Acquire::http::Timeout, "the connection as well as the data
  # timeout", apt-transport-http(1); https has its own key). The runner's
  # sources name a mirror list (mirror+file:/etc/apt/apt-mirrors.txt: its
  # cloud's mirror, then https://archive.ubuntu.com), and apt tries the next
  # mirror only once a file has failed on the first, retries included
  # (apt-transport-mirror(1)), so one retry, as the runner image sets itself,
  # keeps that failover quick. On the command line these win over the image's
  # /etc/apt/apt.conf.d (apt.conf(5), the order apt reads its configuration).
  # A mirror that is slow but still sending fails nothing: see the install
  APT_NETWORK_OPTIONS: -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

jobs:
  # The behavior tests run once per interpreter and shard, each job on its
  # own runner, and each runs its unit files in parallel on the runner's
  # cores (test/run.lua: as many processes as nproc, at most 8). Run in one
  # process each suite took 9 to 11 minutes (run 44224340612: 8 min 58 s on
  # Lua 5.3, 10 min 47 s on LuaJIT), twice an engine shard's 3.5 to 5.5.
  # On a 32-core machine at 3.8's package x5 the suite took 7.5 to 8 minutes
  # in one process and 2.3 to 2.4 in 4, and no count of processes takes it
  # under its slowest file (then ui_layout_test.lua, about 2 minutes there;
  # since #1001 split it, structure_test.lua, about 90 s alone). CI
  # ran the one-process suite in 1.25 (Lua 5.3) to 1.6 (LuaJIT) times that
  # machine's time (docs/checks.md, The Lua jobs and their times)
  lua-suite:
    name: lua (${{ matrix.lua }}, ${{ matrix.shard }})
    # A shard of the suite on 4 cores (121 to 471 s), plus the setup: under
    # half a minute on a fast mirror; on a slow one, with the list's apt-get
    # update to its 45 s, its kill and its retry to 60 s (#999), about 153 s
    # on a cache hit and 218 s on a miss. 12 covers the slowest suite
    # measured (471 s, run 45320574628) after that setup, on a hit (about
    # 624 s) and on a miss (about 689 s): docs/checks.md, Installs.
    # The shards weigh the same; until #1001 split it, shard 1's time was
    # ui_layout_test.lua's alone (240 s by itself on a 32-core machine),
    # the 471 s among them. The default is 360
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # norns runs Lua 5.3 (matron links lua53); LuaJIT catches 5.1-isms
        lua: [lua5.3, luajit]
        # The shards of the unit files (test/run.lua --shard K/N; every file
        # in exactly one, test/unit/docs_test.lua checks the list is whole).
        # Two shards since #991: with 3.9's tables and walks (4419 tests) one
        # shard's Behavior tests took 432 to 539 s on Lua 5.3 and 512 to 613 s
        # on LuaJIT on the 4-core runners (runs on 852231b9, 1aec87dc and
        # 8dafeba0, the last canceled at the job's limit with every test
        # passing). The aim stays no Lua job over 5 minutes; a third shard
        # gains little, since no shard runs faster than its slowest file
        # (structure_test.lua since #1001 split ui_layout_test.lua)
        shard: ["1/2", "2/2"]
    steps:
      # Pinned by commit (a tag can move). To move it: `gh api repos/actions/checkout/releases/latest`
      # names the newest release, its tag's commit goes here with the version in the comment (#533)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # 7 s at most in 32 jobs (#993). Every step before the suite has a
        # limit of its own, and those limits (9 minutes) and a minute for the
        # runner's own steps fit inside the job's 12, so a hung step of the
        # setup fails by its own name (docs/checks.md, Installs)
        timeout-minutes: 1

      # Both on each runner, as the one job before had them (Lua 5.3's
      # global-reference checks need its luac5.3; LuaJIT skips them).
      # Their package files are kept between runs as the engine shards keep
      # theirs, by the same steps and checks under a key of their own (#993:
      # on the runners whose mirror was slow, the install's apt-get update
      # took up to 131 s and its 751 kB download up to 63 s, and four jobs
      # were stopped at the install's 3 minutes with no test run). This step
      # lists every file the two packages need on a system with nothing
      # installed, each with its SHA512 from apt's lists, and names the
      # cache entry after that list
      - name: List Lua 5.3 and LuaJIT's packages
        id: packages
        # its apt-get update reads the mirrors: 1 to 34 s on a fast one, 73
        # to 155 s on a slow one or no end at all (#993, #999). So it runs
        # under timeout 45 and, killed or failed, once more under timeout 60
        # with https://archive.ubuntu.com first, the install's own reorder:
        # 115 s at most with the apt-cache work (about 3 s) when the retry
        # succeeds, and both tries unfinished fail by the ::error:: line.
        # Both read Ubuntu's sources file alone with --error-on=any (#1005):
        # a list of Ubuntu's that fails with only apt's warning, which exits
        # 0 and keeps the old list, exits 100, takes the retry and then the
        # ::error:: line; the runner's third-party sources fail nothing and
        # keep their lists (--no-list-cleanup). Then the step checks that the
        # update read Ubuntu's main and universe for the runner's release
        # (about a second, inside the apt-cache work's 5 s), and the package
        # list and its sums are read from Ubuntu's lists alone too
        timeout-minutes: 3
        run: |
          set -o pipefail
          mirrors=/etc/apt/apt-mirrors.txt
          ubuntu_only=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          status=0
          sudo timeout --kill-after=5 45 apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" --error-on=any --no-list-cleanup update || status=$?
          if [ "$status" -ne 0 ] && grep -q '^https://archive\.ubuntu\.com/ubuntu/[[:space:]]' "$mirrors"; then
            echo "::warning::apt's update failed or was unfinished after 45 s (exit $status): trying https://archive.ubuntu.com first"
            sudo sed -i -E '/^https:\/\/archive\.ubuntu\.com\/ubuntu\//! s/priority:[0-9]+/priority:9/' "$mirrors"
            cat "$mirrors"
            status=0
            sudo timeout --kill-after=5 60 apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" --error-on=any --no-list-cleanup update || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::apt's lists did not update (exit $status; 124 or 137: too slow; 100: a list of Ubuntu's did not download, apt's E: lines above name it). Nothing was installed or checked: rerun this job"
            exit 1
          fi
          release=$(sed -n 's/^VERSION_CODENAME=//p' /etc/os-release) || release=
          targets=$(apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" indextargets --format '$(RELEASE) $(COMPONENT) $(CREATED_BY)') || targets=
          for component in main universe; do
            if ! grep -qx "$release $component Packages" <<< "$targets"; then
              echo "::error::Ubuntu's $release $component list is not among the lists the update read: the SHA512 list would come from a stale one. Nothing was installed or checked"
              exit 1
            fi
          done
          : > "$RUNNER_TEMP/empty-status"
          nothing_installed=(-o Dir::State::status="$RUNNER_TEMP/empty-status")
          apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" "${nothing_installed[@]}" install -s lua5.3 luajit \
            | awk '/^Inst / { for (i = 3; i <= NF; i++) if (substr($i, 1, 1) == "(") { print $2 "=" substr($i, 2); break } }' \
            > "$RUNNER_TEMP/lua-install.txt"
          xargs apt-cache "${ubuntu_only[@]}" "${nothing_installed[@]}" show < "$RUNNER_TEMP/lua-install.txt" \
            | awk -v native="$(dpkg --print-architecture)" \
                '/^Package: / { p = $2 } /^Version: / { v = $2 } /^Architecture: / { a = $2 } /^SHA512: / { s = $2 }
                 /^$/ { if (s != "" && (a == native || a == "all")) { gsub(/:/, "%3a", v); print s "  " p "_" v "_" a ".deb" }; p = v = a = s = "" }' \
            | sort -u > "$RUNNER_TEMP/lua-packages.sha512"
          if [ "$(wc -l < "$RUNNER_TEMP/lua-packages.sha512")" -lt "$(wc -l < "$RUNNER_TEMP/lua-install.txt")" ]; then
            echo "a package has no SHA512 in apt's lists"; exit 1
          fi
          prefix="lua-debs-$ImageOS-$RUNNER_ARCH-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(sha256sum < "$RUNNER_TEMP/lua-packages.sha512" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < "$RUNNER_TEMP/lua-packages.sha512") package files in the list"

      # Read as the engine shards' entry is (docs/checks.md, Installs): what
      # main's runs saved and what this pull request's runs saved. A miss,
      # or a restore that fails or times out, only means apt downloads the
      # files. The entry is under a megabyte
      - name: Restore Lua 5.3 and LuaJIT's packages
        id: restore
        # The engine shards' release (#533)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 1
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/lua-debs
          key: ${{ steps.packages.outputs.key }}
          restore-keys: ${{ steps.packages.outputs.prefix }}

      # As the engine shards install: a kept file reaches apt only when its
      # SHA512 is the one apt's lists give, apt downloads what the cache
      # lacks, a download unfinished after 20 s (a normal one takes a second)
      # runs again with https://archive.ubuntu.com first, and the kept folder
      # is then refilled with the list's files for the save below
      - name: Install Lua 5.3 and LuaJIT
        # The slowest install that succeeds: 20 s and 5 to kill the first
        # try, 30 and 5 for the second, then the refill and the unpacking
        # (a second or two): under 70 s, inside its 2 minutes
        timeout-minutes: 2
        run: |
          packages=(lua5.3 luajit)
          debs="$RUNNER_TEMP/lua-debs"
          archives=/var/cache/apt/archives
          mirrors=/etc/apt/apt-mirrors.txt
          mkdir -p "$debs"
          kept=0
          while read -r sum name; do
            if [ -f "$debs/$name" ] && echo "$sum  $debs/$name" | sha512sum --check --status; then
              sudo cp "$debs/$name" "$archives/"
              kept=$((kept + 1))
            fi
          done < "$RUNNER_TEMP/lua-packages.sha512"
          echo "$kept package files from the cache, each matching apt's lists"
          status=0
          sudo timeout --kill-after=5 20 apt-get $APT_NETWORK_OPTIONS install -y --download-only "${packages[@]}" || status=$?
          if { [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; } && grep -q '^https://archive\.ubuntu\.com/ubuntu/[[:space:]]' "$mirrors"; then
            echo "::warning::apt's first mirror is slow (download unfinished after 20 s): trying https://archive.ubuntu.com first"
            sudo sed -i -E '/^https:\/\/archive\.ubuntu\.com\/ubuntu\//! s/priority:[0-9]+/priority:9/' "$mirrors"
            cat "$mirrors"
            status=0
            sudo timeout --kill-after=5 30 apt-get $APT_NETWORK_OPTIONS install -y --download-only "${packages[@]}" || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the packages did not download (exit $status; 124 or 137: too slow). The Lua suite never ran: rerun this job"
            exit 1
          fi
          rm -f -- "$debs"/*.deb
          while read -r sum name; do
            if [ -f "$archives/$name" ]; then cp "$archives/$name" "$debs/"; fi
          done < "$RUNNER_TEMP/lua-packages.sha512"
          sudo apt-get $APT_NETWORK_OPTIONS install -y "${packages[@]}"

      # Kept by the step right after the install when the key was not an
      # exact hit: the four jobs of a run try the one key, the first saves
      # it and the others only log that it is taken
      - name: Keep Lua 5.3 and LuaJIT's packages
        if: steps.restore.outputs.cache-hit != 'true'
        # The restore's release (#533)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/lua-debs
          key: ${{ steps.packages.outputs.key }}

      # The run's processes are the runner's cores: the log says how many
      - name: The runner's cores
        timeout-minutes: 1
        run: nproc

      - name: Behavior tests
        run: ${{ matrix.lua }} test/run.lua --shard ${{ matrix.shard }}

      # Once a run: in the Lua 5.3 job of shard 1
      - name: Lua / engine command sync check
        if: matrix.lua == 'lua5.3' && startsWith(matrix.shard, '1/')
        run: lua5.3 test/sync_check.lua

  # The required status check: passes only when both suites passed (a
  # failed, canceled or skipped one fails it), so branch protection keeps
  # requiring one job named lua
  lua:
    name: lua
    needs: lua-suite
    if: always()
    # Only reads the suites' result; the default is 360
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Both Lua suites passed
        run: |
          echo "lua suites: ${{ needs.lua-suite.result }}"
          test "${{ needs.lua-suite.result }}" = success

  # The engine check's areas run in parallel shards, each on its own runner
  # with its own sclang and scsynth, so the job takes about as long as its
  # slowest shard instead of the sum of every area. The
  # groups are balanced from the per-area times the check prints ("area
  # <name>: <seconds> s"); every area is in exactly one shard
  # (test/unit/docs_test.lua checks it). Rebalance when an area grows.
  # Area times on SuperCollider 3.13 (s, whole seconds, each engine shard's log of the tests run 44395161831 on main at 8d2717d0, 2026-11-18; outrings as #809's checks left it, measured on 3.14.1, 62 s in that run; types as #828-#831's checks left it, 170 s on 3.13 in Docker, 163 s in that run; freeze and outrings with #833-#835's and #858's checks, 70 s and 89 s on 3.14.1, 69.5 s and 88.5 s on 3.13; onsets with #872's and #888's checks, 1 to 1.5 s more on 3.14.1 and 3.13; lifecycle and mix with #940's and #886's checks, about 0.5 s and 1.7 s more on 3.14.1; buffers, record and delay with #885's, #889's, #890's and #946's checks, 1 s more each, measured on 3.14.1 and 3.13 against main; record with #944's walk of its state table, 4 s less on 3.14.1 and 3.13; record, onsets and mix with #963's, #964's, #966's, #981's and #982's checks, record 125 s on 3.13 in Docker, 6 s more, onsets and mix within a second; lifecycle and notes with the seeded walks of the synth sets and the note slots and #958's checks, 1 s more each on 3.14.1 and 3.13; lifecycle, freeze and rings with #1000's walk on a high engine and its burst check, within a second on 3.14.1 and 3.13):
  # types 170, variation 136, memory 127, effects 127, record 125, lifecycle 116, loops 100, buffers 91,
  # modulation 90, outrings 89, notes 87, voices 75, mix 73, rings 70, freeze 70, grains 49, shimmer 40,
  # files 26, waveform 26, positions 24, delay 23, envelopes 15, tuning 9, performance 8, onsets 7,
  # structure 6: 1780 s in all. The slowest shard is buffers, loops and types, about 362 s of
  # areas, under each shard's 570 s; mix, variation, grains, structure and performance take about
  # 272 s, effects, voices and outrings 291 s, lifecycle, files, positions and notes 253 s, record,
  # waveform, onsets, delay and shimmer 221 s, memory and rings 197 s, and modulation, freeze,
  # envelopes and tuning 184 s. In that run every shard passed.
  # memory runs first in its shard (areaOrder), so CI's memory figures are the area's alone.
  # Since #652 the areas no longer depend on each other's order, so the grouping is a
  # choice for the times alone; files and structure share no shard only because this
  # layout is as balanced as any that pairs them. record and waveform share a shard for the
  # times alone too: #211's collector failure in waveform's 300 s check is fixed (#681), and its
  # count-error lines seen again in any shard are a regression of the areaCall rule to find
  # (docs/status.md), not a run to repeat.
  engine-shard:
    name: engine (${{ matrix.areas }})
    # The sum of every step's own limit (#790: the two checkouts 2 minutes
    # each, list 4, restore 2, install 4, save 2, JACK 2, the check 11, the
    # three refusal checks 2, 2 and 3: 36 minutes) and a minute for the
    # runner's own steps (set up job, the checkout's post step, complete job:
    # 6 s at most in five runs), so a hung step fails by its own name before
    # the job's limit (docs/checks.md, Installs); the default is 360
    timeout-minutes: 37
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # memory shares its shard with no area that builds a high tier engine:
      # sharing one with freeze (both build them), it was where sclang's
      # garbage collector crashed (#131); rings builds a standard engine only
      matrix:
        areas:
          - buffers,loops,types
          - lifecycle,files,positions,notes
          - effects,voices,outrings
          - mix,variation,grains,structure,performance
          - modulation,freeze,envelopes,tuning
          - memory,rings
          - record,waveform,onsets,delay,shimmer
    env:
      STRATA_ENGINE_CHECK_AREAS: ${{ matrix.areas }}
      # the norns commit the engine is compiled against (sc/core classes), in full:
      # a short name could match a branch or tag of that name first (#490)
      NORNS_REF: 227aa0442181e3eab3fc189ee6b5342648ce7300
      NORNS_DIR: ${{ github.workspace }}/norns
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
      # SuperCollider is pinned to Ubuntu 24.04's package (upstream 3.13.0).
      # norns ships SuperCollider 3.13.0 (SUPERCOLLIDER_VERSION in norns'
      # Dockerfile; the norns repo records no other version), so this is the
      # same upstream release; only Ubuntu's packaging differs. Bump both
      # packages together, and re-check against norns' Dockerfile. To find a
      # version string, run `apt-cache madison supercollider-language` on the
      # runner image (ubuntu-24.04): it lists every version apt can install.
      # supercollider-common is not named below, but it is pinned all the
      # same: supercollider-language depends on exactly its own version of
      # it (see `apt-cache show supercollider-language`).
      SC_APT_VERSION: 1:3.13.0+repack-1ubuntu3
    steps:
      # Pinned by commit (a tag can move). To move it: `gh api repos/actions/checkout/releases/latest`
      # names the newest release, its tag's commit goes here with the version in the comment (#533)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # 9 s at most in five runs of seven shards; so for each short step below
        timeout-minutes: 2

      - name: Check out norns
        # 2 s at most
        timeout-minutes: 2
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/monome/norns.git "$NORNS_DIR"
          git -C "$NORNS_DIR" checkout "$NORNS_REF"

      # The install keeps its package files between runs (#785: a slow mirror
      # canceled three of the shards, still downloading their 111 MB at 142 kB/s,
      # where the others took seconds). This step lists every file the three
      # packages need on a system with nothing installed (an empty dpkg
      # status), each with its SHA512 from apt's lists, and names the cache
      # entry after that list. Every shard gets the same key whatever its image
      # has installed (in #785's run one fleet had a library the other
      # downloaded) and whichever mirror it uses; a new build of any package
      # makes a new key, and the old entry ages out
      - name: List SuperCollider and JACK's packages
        id: packages
        # 7 to 103 s in five runs, and up to 155 s or no end at all on a slow
        # mirror (#999): its apt-get update reads the mirrors whose slowness
        # #785 met. As the Lua job's list: timeout 45, then once more under
        # timeout 60 with https://archive.ubuntu.com first, 115 s at most when
        # the retry succeeds (about 5 s of apt-cache work), inside the 4 minutes.
        # As the Lua job's list too (#1005): Ubuntu's sources alone, a list of
        # theirs that did not download fails, the step checks the update read
        # Ubuntu's main and universe for the runner's release, and the package
        # list and its sums are read from Ubuntu's lists alone
        timeout-minutes: 4
        run: |
          set -o pipefail
          mirrors=/etc/apt/apt-mirrors.txt
          ubuntu_only=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          status=0
          sudo timeout --kill-after=5 45 apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" --error-on=any --no-list-cleanup update || status=$?
          if [ "$status" -ne 0 ] && grep -q '^https://archive\.ubuntu\.com/ubuntu/[[:space:]]' "$mirrors"; then
            echo "::warning::apt's update failed or was unfinished after 45 s (exit $status): trying https://archive.ubuntu.com first"
            sudo sed -i -E '/^https:\/\/archive\.ubuntu\.com\/ubuntu\//! s/priority:[0-9]+/priority:9/' "$mirrors"
            cat "$mirrors"
            status=0
            sudo timeout --kill-after=5 60 apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" --error-on=any --no-list-cleanup update || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::apt's lists did not update (exit $status; 124 or 137: too slow; 100: a list of Ubuntu's did not download, apt's E: lines above name it). Nothing was installed or checked: rerun this job"
            exit 1
          fi
          release=$(sed -n 's/^VERSION_CODENAME=//p' /etc/os-release) || release=
          targets=$(apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" indextargets --format '$(RELEASE) $(COMPONENT) $(CREATED_BY)') || targets=
          for component in main universe; do
            if ! grep -qx "$release $component Packages" <<< "$targets"; then
              echo "::error::Ubuntu's $release $component list is not among the lists the update read: the SHA512 list would come from a stale one. Nothing was installed or checked"
              exit 1
            fi
          done
          : > "$RUNNER_TEMP/empty-status"
          nothing_installed=(-o Dir::State::status="$RUNNER_TEMP/empty-status")
          apt-get $APT_NETWORK_OPTIONS "${ubuntu_only[@]}" "${nothing_installed[@]}" install -s jackd2 \
              "supercollider-language=$SC_APT_VERSION" "supercollider-server=$SC_APT_VERSION" \
            | awk '/^Inst / { for (i = 3; i <= NF; i++) if (substr($i, 1, 1) == "(") { print $2 "=" substr($i, 2); break } }' \
            > "$RUNNER_TEMP/sc-install.txt"
          xargs apt-cache "${ubuntu_only[@]}" "${nothing_installed[@]}" show < "$RUNNER_TEMP/sc-install.txt" \
            | awk -v native="$(dpkg --print-architecture)" \
                '/^Package: / { p = $2 } /^Version: / { v = $2 } /^Architecture: / { a = $2 } /^SHA512: / { s = $2 }
                 /^$/ { if (s != "" && (a == native || a == "all")) { gsub(/:/, "%3a", v); print s "  " p "_" v "_" a ".deb" }; p = v = a = s = "" }' \
            | sort -u > "$RUNNER_TEMP/sc-packages.sha512"
          if [ "$(wc -l < "$RUNNER_TEMP/sc-packages.sha512")" -lt "$(wc -l < "$RUNNER_TEMP/sc-install.txt")" ]; then
            echo "a package has no SHA512 in apt's lists"; exit 1
          fi
          prefix="sc-debs-$ImageOS-$RUNNER_ARCH-$SC_APT_VERSION-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(sha256sum < "$RUNNER_TEMP/sc-packages.sha512" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < "$RUNNER_TEMP/sc-packages.sha512") package files in the list"

      # GitHub's scoping (docs/checks.md, Installs): a pull request's run reads
      # what main's runs saved and what its own pull request's merge ref saved
      # (a rerun of a slow shard finds what a faster shard saved), never
      # another pull request's. A miss, or a restore that fails or times out,
      # only means apt downloads the files
      - name: Restore SuperCollider and JACK's packages
        id: restore
        # Pinned by commit, as checkout is (#533): `gh api repos/actions/cache/releases/latest`
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/sc-debs
          key: ${{ steps.packages.outputs.key }}
          restore-keys: ${{ steps.packages.outputs.prefix }}

      # apt decides what to install, and downloads every file the cache lacks.
      # A kept file reaches apt only when its SHA512 is the one apt's lists
      # give: apt takes any file of the right size in its archive folder as
      # downloaded, so a damaged one would only fail in dpkg. A slow mirror
      # fails no file, so neither apt's timeout nor its mirror failover ends
      # it: a download unfinished after 45 s (a normal one takes 3-12 s) is
      # stopped and run again with https://archive.ubuntu.com, the runner's
      # own second mirror, put first in its mirror list. The lists, their
      # signatures and every file's hash are apt's as before; files already
      # downloaded stay. Unfinished again after 75 s, the step fails by name.
      # The kept folder is then refilled with the list's files, so the save
      # below can run before anything is unpacked
      - name: Install SuperCollider and JACK
        # The slowest install that succeeds: 45 s and 5 to kill the first try,
        # 75 and 5 for the second, then the refill and the unpacking, which a
        # whole cached install did in 38 s at most (five runs, docs/checks.md):
        # about 170 s, inside its 4 minutes, and a download that never
        # finishes fails by the ::error:: line
        timeout-minutes: 4
        run: |
          echo "jackd2 jackd/tweak_rt_limits boolean false" | sudo debconf-set-selections
          packages=(jackd2 "supercollider-language=$SC_APT_VERSION" "supercollider-server=$SC_APT_VERSION")
          debs="$RUNNER_TEMP/sc-debs"
          archives=/var/cache/apt/archives
          mirrors=/etc/apt/apt-mirrors.txt
          mkdir -p "$debs"
          kept=0
          while read -r sum name; do
            if [ -f "$debs/$name" ] && echo "$sum  $debs/$name" | sha512sum --check --status; then
              sudo cp "$debs/$name" "$archives/"
              kept=$((kept + 1))
            fi
          done < "$RUNNER_TEMP/sc-packages.sha512"
          echo "$kept package files from the cache, each matching apt's lists"
          status=0
          sudo timeout --kill-after=5 45 apt-get $APT_NETWORK_OPTIONS install -y --download-only "${packages[@]}" || status=$?
          if { [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; } && grep -q '^https://archive\.ubuntu\.com/ubuntu/[[:space:]]' "$mirrors"; then
            echo "::warning::apt's first mirror is slow (download unfinished after 45 s): trying https://archive.ubuntu.com first"
            sudo sed -i -E '/^https:\/\/archive\.ubuntu\.com\/ubuntu\//! s/priority:[0-9]+/priority:9/' "$mirrors"
            cat "$mirrors"
            status=0
            sudo timeout --kill-after=5 75 apt-get $APT_NETWORK_OPTIONS install -y --download-only "${packages[@]}" || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the packages did not download (exit $status; 124 or 137: too slow). The engine check never ran: rerun this job"
            exit 1
          fi
          rm -f -- "$debs"/*.deb
          while read -r sum name; do
            if [ -f "$archives/$name" ]; then cp "$archives/$name" "$debs/"; fi
          done < "$RUNNER_TEMP/sc-packages.sha512"
          sudo apt-get $APT_NETWORK_OPTIONS install -y "${packages[@]}"

      # Saved right after the install, whatever the check does later, when the
      # key was not an exact hit: the first shard to install saves the entry,
      # and a rerun of a shard that was too slow restores it. Every shard may
      # try the one key: the first saves it and the others only log that it is
      # taken (actions/cache's save logs a refused save and never fails on it)
      - name: Keep SuperCollider and JACK's packages
        if: steps.restore.outputs.cache-hit != 'true'
        # The restore's release (#533)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/sc-debs
          key: ${{ steps.packages.outputs.key }}

      # scsynth talks to JACK; a dummy driver needs no sound card
      - name: Start JACK (dummy driver)
        # 4 s at most (its own wait gives up after 10 s)
        timeout-minutes: 2
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 1024 > "$RUNNER_TEMP/jackd.log" 2>&1 &
          for i in $(seq 1 20); do jack_lsp > /dev/null 2>&1 && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/jackd.log"; exit 1

      # 360 s at most in five runs. timeout signals the runner at 600 s; the
      # runner's own stop (sclang's tree, then up to 10 s for its scsynth)
      # ends it within about 11 s, and a process that ignores the signal is
      # killed 15 s after it: 615 s at most, inside the step's 660
      - name: Engine check
        run: SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=570 timeout --kill-after=15 600 test/run_engine_check.sh "$NORNS_DIR"
        timeout-minutes: 11

      # A failed precondition must end the run with its own line and nothing
      # after it (#485): the unknown area's failure line, and no ERROR line
      # 2 s at most; at its ENGINE_CHECK_TIMEOUT of 60 s, the runner's 10 s
      # kill-after and 10 s for a scsynth to end, about 80 s
      - name: Engine check refuses an unknown area cleanly
        timeout-minutes: 2
        run: |
          status=0
          out=$(STRATA_ENGINE_CHECK_AREAS=nosucharea SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=60 test/run_engine_check.sh "$NORNS_DIR" 2>&1) || status=$?
          echo "$out" | head -20
          test "$status" -eq 1
          echo "$out" | grep -q "^ENGINE CHECK FAILED: no area nosucharea"
          if echo "$out" | grep -q "^ERROR"; then echo "an ERROR line follows the failure"; exit 1; fi

      # A port that already has a server must fail the run at once, naming the
      # port, and must leave that server running (#471). These two steps run
      # on one shard only, record, waveform, onsets, delay and shimmer's (well under its timeout).
      # 6 s at most; 3 s and the 80 s above at its 60 s
      - name: Engine check refuses a port that already has a server
        if: matrix.areas == 'record,waveform,onsets,delay,shimmer'
        timeout-minutes: 2
        run: |
          scsynth -u 57391 > "$RUNNER_TEMP/scsynth-other.log" 2>&1 &
          other=$!
          sleep 3
          status=0
          out=$(STRATA_SC_PORT=57391 STRATA_ENGINE_CHECK_AREAS=structure SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=60 test/run_engine_check.sh "$NORNS_DIR" 2>&1) || status=$?
          alive=0
          kill -0 "$other" 2>/dev/null && alive=1
          kill "$other" 2>/dev/null || true
          echo "$out" | head -20
          test "$status" -eq 1
          echo "$out" | grep -q "^ENGINE CHECK FAILED: port 57391 already has a server"
          test "$alive" -eq 1

      # A server that cannot boot (the port held by a socket that never
      # answers) must fail the run within seconds, naming the cause (#472)
      # 7 s at most; 1 s, its ENGINE_CHECK_TIMEOUT of 100 s, 10 s and 10 s
      # at most at its own limit: about 121 s
      - name: Engine check fails at once when scsynth cannot boot
        if: matrix.areas == 'record,waveform,onsets,delay,shimmer'
        timeout-minutes: 3
        run: |
          python3 -c 'import socket, time; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.1", 57392)); time.sleep(120)' &
          holder=$!
          sleep 1
          status=0
          started=$(date +%s)
          out=$(STRATA_SC_PORT=57392 STRATA_ENGINE_CHECK_AREAS=structure SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=100 test/run_engine_check.sh "$NORNS_DIR" 2>&1) || status=$?
          took=$(( $(date +%s) - started ))
          kill "$holder" 2>/dev/null || true
          echo "$out" | head -20
          echo "took $took s"
          test "$status" -eq 1
          echo "$out" | grep -q "^ENGINE CHECK FAILED: scsynth did not boot"
          test "$took" -lt 40

  # The required status check: passes only when every shard passed (a
  # failed, canceled or skipped shard fails it), so branch protection keeps
  # requiring one job named engine
  engine:
    name: engine
    needs: engine-shard
    if: always()
    # Only reads the shards' result; the default is 360
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Every engine shard passed
        run: |
          echo "engine shards: ${{ needs.engine-shard.result }}"
          test "${{ needs.engine-shard.result }}" = success
