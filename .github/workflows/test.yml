name: tests

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository (a pull request runs its own test code
# here), so the token gets no more than that (#490)
permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Runs on main are
# never canceled: each gets a group of its own (in a shared group a pending
# run would still be replaced by the next one, even without cancel-in-progress)
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    name: lua
    # Covers the apt install and both suites (a few minutes); the default is 360
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit (a tag can move). To move it: `gh api repos/actions/checkout/releases/latest`
      # names the newest release, its tag's commit goes here with the version in the comment (#533)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # norns runs Lua 5.3 (matron links lua53); LuaJIT catches 5.1-isms
      - name: Install Lua 5.3 and LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 luajit

      - name: Behavior tests (Lua 5.3)
        run: lua5.3 test/run.lua

      - name: Behavior tests (LuaJIT)
        run: luajit test/run.lua

      - name: Lua / engine command sync check
        run: lua5.3 test/sync_check.lua

  # The engine check's areas run in parallel shards, each on its own runner
  # with its own sclang and scsynth, so the job takes about as long as its
  # slowest shard instead of the sum of every area. The
  # groups are balanced from the per-area times the check prints ("area
  # <name>: <seconds> s"); every area is in exactly one shard
  # (test/unit/docs_test.lua checks it). Rebalance when an area grows.
  # Area times on SuperCollider 3.13 at 3.3.0 (s, the mean of four full runs in Docker; 3.14.1's are within 2 s):
  # record 110, lifecycle 106, buffers 99, effects 87, mix 69, rings 69, memory 67, voices 66,
  # freeze 63, loops 54, variation 52, files 29, grains 23, waveform 23, positions 8, structure 4, performance 3:
  # 932 s in all, and at most about 152 s a shard (voices, freeze and grains), far under each
  # shard's 570 s. waveform (a 300 s high engine, where #211's collector failure shows) shares
  # its shard only with record, which builds no high engine (buffers, effects, files, freeze,
  # memory and performance do); four full runs on 3.13 at 3.3.0 passed with the pair.
  engine-shard:
    name: engine (${{ matrix.areas }})
    # Covers setup (norns clone, apt install, JACK) plus the check's own 600 s
    # timeout; the default is 360
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # memory runs alone: sharing a shard with freeze (both build high
      # tier engines), it was where sclang's garbage collector crashed (#131)
      matrix:
        areas:
          - buffers,variation
          - lifecycle,files,positions
          - effects,loops
          - mix,rings,structure,performance
          - voices,freeze,grains
          - memory
          - record,waveform
    env:
      STRATA_ENGINE_CHECK_AREAS: ${{ matrix.areas }}
      # the norns commit the engine is compiled against (sc/core classes), in full:
      # a short name could match a branch or tag of that name first (#490)
      NORNS_REF: 227aa0442181e3eab3fc189ee6b5342648ce7300
      NORNS_DIR: ${{ github.workspace }}/norns
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
      # SuperCollider is pinned to Ubuntu 24.04's package (upstream 3.13.0).
      # norns ships SuperCollider 3.13.0 (SUPERCOLLIDER_VERSION in norns'
      # Dockerfile; the norns repo records no other version), so this is the
      # same upstream release; only Ubuntu's packaging differs. Bump both
      # packages together, and re-check against norns' Dockerfile. To find a
      # version string, run `apt-cache madison supercollider-language` on the
      # runner image (ubuntu-24.04): it lists every version apt can install.
      # supercollider-common is not named below, but it is pinned all the
      # same: supercollider-language depends on exactly its own version of
      # it (see `apt-cache show supercollider-language`).
      SC_APT_VERSION: 1:3.13.0+repack-1ubuntu3
    steps:
      # Pinned by commit (a tag can move). To move it: `gh api repos/actions/checkout/releases/latest`
      # names the newest release, its tag's commit goes here with the version in the comment (#533)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out norns
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/monome/norns.git "$NORNS_DIR"
          git -C "$NORNS_DIR" checkout "$NORNS_REF"

      - name: Install SuperCollider and JACK
        run: |
          echo "jackd2 jackd/tweak_rt_limits boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y jackd2 \
            "supercollider-language=$SC_APT_VERSION" "supercollider-server=$SC_APT_VERSION"

      # scsynth talks to JACK; a dummy driver needs no sound card
      - name: Start JACK (dummy driver)
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 1024 > "$RUNNER_TEMP/jackd.log" 2>&1 &
          for i in $(seq 1 20); do jack_lsp > /dev/null 2>&1 && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/jackd.log"; exit 1

      - name: Engine check
        run: SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=570 timeout 600 test/run_engine_check.sh "$NORNS_DIR"

      # A failed precondition must end the run with its own line and nothing
      # after it (#485): the unknown area's failure line, and no ERROR line
      - name: Engine check refuses an unknown area cleanly
        run: |
          status=0
          out=$(STRATA_ENGINE_CHECK_AREAS=nosucharea SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=60 test/run_engine_check.sh "$NORNS_DIR" 2>&1) || status=$?
          echo "$out" | head -20
          test "$status" -eq 1
          echo "$out" | grep -q "^ENGINE CHECK FAILED: no area nosucharea"
          if echo "$out" | grep -q "^ERROR"; then echo "an ERROR line follows the failure"; exit 1; fi

      # A port that already has a server must fail the run at once, naming the
      # port, and must leave that server running (#471). These two steps run
      # on one shard only, record and waveform's (well under its timeout).
      - name: Engine check refuses a port that already has a server
        if: matrix.areas == 'record,waveform'
        run: |
          scsynth -u 57391 > "$RUNNER_TEMP/scsynth-other.log" 2>&1 &
          other=$!
          sleep 3
          status=0
          out=$(STRATA_SC_PORT=57391 STRATA_ENGINE_CHECK_AREAS=structure SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=60 test/run_engine_check.sh "$NORNS_DIR" 2>&1) || status=$?
          alive=0
          kill -0 "$other" 2>/dev/null && alive=1
          kill "$other" 2>/dev/null || true
          echo "$out" | head -20
          test "$status" -eq 1
          echo "$out" | grep -q "^ENGINE CHECK FAILED: port 57391 already has a server"
          test "$alive" -eq 1

      # A server that cannot boot (the port held by a socket that never
      # answers) must fail the run within seconds, naming the cause (#472)
      - name: Engine check fails at once when scsynth cannot boot
        if: matrix.areas == 'record,waveform'
        run: |
          python3 -c 'import socket, time; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.1", 57392)); time.sleep(120)' &
          holder=$!
          sleep 1
          status=0
          started=$(date +%s)
          out=$(STRATA_SC_PORT=57392 STRATA_ENGINE_CHECK_AREAS=structure SCLANG="$(command -v sclang)" ENGINE_CHECK_TIMEOUT=100 test/run_engine_check.sh "$NORNS_DIR" 2>&1) || status=$?
          took=$(( $(date +%s) - started ))
          kill "$holder" 2>/dev/null || true
          echo "$out" | head -20
          echo "took $took s"
          test "$status" -eq 1
          echo "$out" | grep -q "^ENGINE CHECK FAILED: scsynth did not boot"
          test "$took" -lt 40

  # The required status check: passes only when every shard passed (a
  # failed, canceled or skipped shard fails it), so branch protection keeps
  # requiring one job named engine
  engine:
    name: engine
    needs: engine-shard
    if: always()
    # Only reads the shards' result; the default is 360
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Every engine shard passed
        run: |
          echo "engine shards: ${{ needs.engine-shard.result }}"
          test "${{ needs.engine-shard.result }}" = success
